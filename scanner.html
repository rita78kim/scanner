<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>돌파 스캐너</title>
<style>
  :root{
    --bg:#101418; --surface:#1A2027; --surface2:#212A33; --line:#2A343F;
    --text:#E8ECEF; --dim:#8A94A0; --faint:#5A6470;
    --long:#2FBF8F; --long-bg:rgba(47,191,143,.12);
    --short:#E5544F; --short-bg:rgba(229,84,79,.12);
    --warn:#D9A441; --warn-bg:rgba(217,164,65,.12);
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);
       padding:env(safe-area-inset-top) 0 40px 0;min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:16px}

  header{padding:20px 0 4px}
  h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
  h1 .tf{color:var(--dim);font-weight:600;font-size:13px;margin-left:8px;font-family:var(--mono)}
  .sub{color:var(--dim);font-size:12.5px;margin-top:4px;line-height:1.5}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;
         padding:14px;margin-top:14px}
  .inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .field label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px;font-weight:600}
  .field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;
    color:var(--text);font-family:var(--mono);font-size:15px;padding:9px 10px;text-align:right}
  .field input:focus{outline:none;border-color:var(--dim)}
  .riskline{margin-top:10px;font-size:12px;color:var(--dim)}
  .riskline b{color:var(--text);font-family:var(--mono);font-weight:600}

  .scanbtn{width:100%;margin-top:14px;padding:15px;border:none;border-radius:12px;
    background:var(--text);color:var(--bg);font-size:16px;font-weight:800;
    font-family:var(--sans);cursor:pointer;letter-spacing:.01em}
  .scanbtn:active{opacity:.75}
  .scanbtn:disabled{background:var(--surface2);color:var(--faint);cursor:default}

  .progress{margin-top:12px;display:none}
  .progress.on{display:block}
  .pbar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
  .pfill{height:100%;width:0%;background:var(--dim);transition:width .25s}
  .ptext{font-size:12px;color:var(--dim);margin-top:7px;font-family:var(--mono)}

  .summary{display:none;margin-top:16px;font-size:12.5px;color:var(--dim);line-height:1.6}
  .summary.on{display:block}
  .summary b{color:var(--text)}

  .sect{margin-top:20px;display:none}
  .sect.on{display:block}
  .sect h2{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;
    letter-spacing:.08em;margin-bottom:10px}

  /* ---- 주문표 카드 ---- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
        margin-bottom:12px;overflow:hidden}
  .card.stale{opacity:.5}
  .chead{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line)}
  .badge{font-size:12px;font-weight:800;padding:4px 9px;border-radius:7px;letter-spacing:.03em}
  .badge.long{color:var(--long);background:var(--long-bg)}
  .badge.short{color:var(--short);background:var(--short-bg)}
  .sym{font-family:var(--mono);font-weight:700;font-size:16px}
  .age{margin-left:auto;font-size:11px;color:var(--dim);font-family:var(--mono);text-align:right;line-height:1.4}
  .age .fresh{color:var(--long);font-weight:700}
  .age .old{color:var(--faint)}

  .ticket{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .cell{padding:11px 14px;border-bottom:1px solid var(--line)}
  .cell:nth-child(odd){border-right:1px solid var(--line)}
  .cell .k{font-size:10.5px;color:var(--dim);font-weight:600;margin-bottom:3px}
  .cell .v{font-family:var(--mono);font-size:15px;font-weight:600}
  .cell .v small{font-size:11px;color:var(--dim);font-weight:400;margin-left:4px}
  .v.long{color:var(--long)} .v.short{color:var(--short)}

  .cfoot{padding:10px 14px;font-size:11.5px;color:var(--dim);line-height:1.55}
  .cfoot b{color:var(--text);font-family:var(--mono);font-weight:600}
  .flag{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:6px;
    font-size:11px;font-weight:700}
  .flag.warn{color:var(--warn);background:var(--warn-bg)}
  .flag.stale{color:var(--faint);background:var(--surface2)}

  /* 돌파 임박 */
  .near{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .nrow{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);
    font-size:13px}
  .nrow:last-child{border-bottom:none}
  .nrow .sym{font-size:13.5px;flex:0 0 110px}
  .nrow .dir{font-size:11px;font-weight:700;flex:0 0 64px}
  .nrow .dir.long{color:var(--long)} .nrow .dir.short{color:var(--short)}
  .nrow .dist{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--dim)}

  .empty{padding:26px 14px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7}
  .error{display:none;margin-top:14px;padding:13px;border-radius:12px;background:var(--short-bg);
    border:1px solid rgba(229,84,79,.3);color:var(--text);font-size:13px;line-height:1.6}
  .error.on{display:block}

  footer{margin-top:26px;font-size:11px;color:var(--faint);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>돌파 스캐너<span class="tf">BYBIT · 4H · CH55</span></h1>
    <div class="sub">바이비트 USDT 무기한 전 종목 스캔 · 55봉 채널 돌파 · 손절 ATR×2 · 트레일링 ATR×3</div>
  </header>

  <div class="panel">
    <div class="inputs">
      <div class="field"><label>시드 (USDT)</label><input id="seed" type="number" inputmode="decimal" value="350"></div>
      <div class="field"><label>레버리지 (배)</label><input id="lev" type="number" inputmode="decimal" value="3"></div>
      <div class="field"><label>거래대금 (백만$)</label><input id="volmin" type="number" inputmode="decimal" value="10"></div>
    </div>
    <div class="riskline">트레이드당 리스크 <b>1%</b> (숏 <b>0.7배</b>) · 진입은 신호 확인 후 규칙대로만</div>
    <button class="scanbtn" id="btn" onclick="scan()">스캔</button>
    <div class="progress" id="prog"><div class="pbar"><div class="pfill" id="pfill"></div></div><div class="ptext" id="ptext"></div></div>
  </div>

  <div class="error" id="err"></div>
  <div class="summary" id="sum"></div>

  <div class="sect" id="sigSect">
    <h2>신호</h2>
    <div id="sigList"></div>
  </div>

  <div class="sect" id="nearSect">
    <h2>돌파 임박 (0.5 ATR 이내)</h2>
    <div class="near" id="nearList"></div>
  </div>

  <footer>
    규칙: 지나간 신호(돌파 2캔들 경과 또는 현재가가 돌파 종가에서 1 ATR 초과 이탈)는 진입하지
    않는다 · 숏 펀딩비 −0.05%/8h 이하이면 스킵 · 손절·트레일링은 진입과 동시에 거래소에 등록한다 ·
    이 도구는 신호 표시기일 뿐이며 수익을 보장하지 않는다.
  </footer>
</div>

<script>
"use strict";
// ===================== 설정 =====================
const CFG = {
  ENTRY_CH: 55,        // 진입 채널 (봉)
  ATR_P: 14,           // ATR 기간
  SL_ATR: 2.0,         // 손절 = ATR x 2
  TRAIL_ATR: 3.0,      // 트레일링 = ATR x 3 (콜백%로 환산)
  TP_R: 2.0,           // 고정 익절 = 손절 거리의 2배 (2R)
  RISK: 0.01,          // 트레이드당 리스크 1%
  SHORT_MULT: 0.7,     // 숏 크기 축소
  FUND_LIMIT: -0.0005, // 숏 펀딩 필터: -0.05%/8h 이하이면 경고
  FRESH_ATR: 1.0,      // 신선도: 현재가가 돌파 종가에서 1 ATR 이내
  NEAR_ATR: 0.5,       // 돌파 임박: 채널까지 0.5 ATR 이내
  BATCH: 8,            // 동시 요청 수
  KLIMIT: 120          // 캔들 개수
};
const API = "https://api.bybit.com";
const $ = id => document.getElementById(id);

function fmt(n, ref){ // 가격 자릿수: 값 크기에 맞춰
  if(!isFinite(n)) return "-";
  const a = Math.abs(ref ?? n);
  const d = a>=1000?1: a>=100?2: a>=1?4: a>=0.01?6: 8;
  return n.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:d});
}
const pct = n => (n*100).toFixed(2)+"%";

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j = await r.json();
  if(j.retCode !== 0) throw new Error("API: "+j.retMsg);
  return j.result;
}

function atr14(c, endIdx){ // c: 오래된->최신, endIdx 포함 최근 ATR_P개 TR 평균
  let s = 0, n = 0;
  for(let i = endIdx; i > endIdx - CFG.ATR_P && i > 0; i--){
    const h=c[i].h, l=c[i].l, pc=c[i-1].c;
    s += Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc)); n++;
  }
  return n ? s/n : NaN;
}

function analyze(sym, kl, tick){
  // kl: bybit 응답(최신 먼저) -> 오래된 순으로
  const rows = kl.slice().reverse().map(r=>({t:+r[0],o:+r[1],h:+r[2],l:+r[3],c:+r[4]}));
  if(rows.length < CFG.ENTRY_CH + CFG.ATR_P + 3) return null;
  const closed = rows.slice(0, -1);          // 마지막(진행 중) 캔들 제외
  const i0 = closed.length - 1;              // 최근 마감 캔들 C0
  const C0 = closed[i0], C1 = closed[i0-1];

  const win = (endEx) => {                   // endEx 이전 ENTRY_CH봉의 채널
    let hi=-Infinity, lo=Infinity;
    for(let i=endEx-CFG.ENTRY_CH;i<endEx;i++){ if(closed[i].h>hi)hi=closed[i].h; if(closed[i].l<lo)lo=closed[i].l; }
    return {hi,lo};
  };
  const ch0 = win(i0);        // C0 진입 판정용 (C0 제외 직전 55봉)
  const ch1 = win(i0-1);      // C1 판정용 (첫 돌파 여부 확인)
  const atr = atr14(closed, i0);
  if(!isFinite(atr) || atr<=0) return null;

  const last = +tick.lastPrice;
  const fund = parseFloat(tick.fundingRate ?? "0");

  let side=null;
  if(C0.c > ch0.hi) side="long";
  else if(C0.c < ch0.lo) side="short";

  const out = {sym, last, atr, fund, closeT:C0.t + 4*3600*1000};

  if(side){
    const firstBreak = side==="long" ? !(C1.c > ch1.hi) : !(C1.c < ch1.lo);
    const drift = Math.abs(last - C0.c) / atr;
    out.side = side;
    out.level = side==="long" ? ch0.hi : ch0.lo;
    out.fresh = firstBreak && drift <= CFG.FRESH_ATR;
    out.staleWhy = !firstBreak ? "돌파 후 2캔들 이상 경과" : (drift>CFG.FRESH_ATR ? "현재가가 돌파 종가에서 1 ATR 초과 이탈" : "");
    out.fundWarn = side==="short" && fund <= CFG.FUND_LIMIT;
    return out;
  }
  // 돌파 임박 체크
  const dUp = (ch0.hi - last)/atr, dDn = (last - ch0.lo)/atr;
  if(dUp>0 && dUp<=CFG.NEAR_ATR){ out.near="long"; out.dist=dUp; out.level=ch0.hi; return out; }
  if(dDn>0 && dDn<=CFG.NEAR_ATR){ out.near="short"; out.dist=dDn; out.level=ch0.lo; return out; }
  return null;
}

function ticket(s, seed, lev){
  const isL = s.side==="long";
  const entry = s.last;                                  // 진입 = 현재가 (시장가)
  const sl    = isL ? entry - CFG.SL_ATR*s.atr : entry + CFG.SL_ATR*s.atr;
  const slPct = Math.abs(entry-sl)/entry;
  const trail = CFG.TRAIL_ATR*s.atr/entry;               // 콜백 비율
  const slDist = Math.abs(entry-sl);
  const tp    = isL ? entry + CFG.TP_R*slDist : entry - CFG.TP_R*slDist; // 고정 TP (2R)
  const tpPct = Math.abs(tp-entry)/entry;
  let risk = seed*CFG.RISK; if(!isL) risk*=CFG.SHORT_MULT;
  const qty   = risk/Math.abs(entry-sl);
  const noti  = qty*entry;
  const marg  = noti/Math.max(lev,1);
  const mins  = Math.max(0, Math.round((Date.now()-s.closeT)/60000));
  const ageTx = mins<60 ? mins+"분 전 마감" : (mins/60).toFixed(1)+"시간 전 마감";

  return `
  <div class="card ${s.fresh?"":"stale"}">
    <div class="chead">
      <span class="badge ${s.side}">${isL?"롱":"숏"}</span>
      <span class="sym">${s.sym.replace("USDT","")}<small style="color:var(--faint);font-size:11px">USDT</small></span>
      <span class="age">${s.fresh?'<span class="fresh">진입 가능</span>':'<span class="old">지나감</span>'}<br>${ageTx}</span>
    </div>
    <div class="ticket">
      <div class="cell"><div class="k">진입가 (시장가)</div><div class="v ${s.side}">${fmt(entry)}</div></div>
      <div class="cell"><div class="k">손절가 · SL <small>(ATR×2)</small></div><div class="v">${fmt(sl,entry)}<small>−${pct(slPct)}</small></div></div>
      <div class="cell"><div class="k">익절가 · TP <small>(2R)</small></div><div class="v">${fmt(tp,entry)}<small>+${pct(tpPct)}</small></div></div>
      <div class="cell"><div class="k">트레일링 <small>(ATR×3, 체결 후 포지션 탭에서)</small></div><div class="v">${pct(trail)}<small>거리 ${fmt(CFG.TRAIL_ATR*s.atr,entry)}</small></div></div>
      <div class="cell"><div class="k">리스크</div><div class="v">${risk.toFixed(2)}<small>USDT</small></div></div>
      <div class="cell"><div class="k">수량</div><div class="v">${fmt(qty)}<small>${s.sym.replace("USDT","")}</small></div></div>
      <div class="cell"><div class="k">포지션 · 증거금</div><div class="v">${noti.toFixed(1)}<small>/ ${marg.toFixed(1)} USDT · ${lev}x</small></div></div>
      <div class="cell"><div class="k">청산 방식</div><div class="v" style="font-size:12px;line-height:1.5;font-family:var(--sans);font-weight:500;color:var(--dim)">TP 또는 트레일링<br>둘 중 하나만 등록</div></div>
    </div>
    <div class="cfoot">
      돌파 기준선 <b>${fmt(s.level,entry)}</b> · 펀딩비 <b>${(s.fund*100).toFixed(4)}%</b>/8h
      ${s.fundWarn?'<br><span class="flag warn">숏 펀딩비 불리 — 규칙상 스킵</span>':""}
      ${!s.fresh?'<br><span class="flag stale">'+s.staleWhy+' — 진입 금지</span>':""}
    </div>
  </div>`;
}

let running=false;
async function scan(){
  if(running) return; running=true;
  const btn=$("btn"); btn.disabled=true; btn.textContent="스캔 중…";
  $("err").className="error"; $("sum").className="summary";
  $("sigSect").className="sect"; $("nearSect").className="sect";
  $("prog").className="progress on"; $("pfill").style.width="0%";
  $("ptext").textContent="전 종목 목록 불러오는 중…";

  const seed=parseFloat($("seed").value)||350;
  const lev =parseFloat($("lev").value)||3;
  const volMin=(parseFloat($("volmin").value)||10)*1e6;

  try{
    const tk = await getJSON(API+"/v5/market/tickers?category=linear");
    const all = tk.list.filter(t=>t.symbol.endsWith("USDT"));
    const pool = all.filter(t=>parseFloat(t.turnover24h)>=volMin)
                    .sort((a,b)=>parseFloat(b.turnover24h)-parseFloat(a.turnover24h));
    $("ptext").textContent=`전체 ${all.length}종목 중 유동성 통과 ${pool.length}종목 · 캔들 분석 중…`;

    const signals=[], nears=[]; let done=0;
    for(let i=0;i<pool.length;i+=CFG.BATCH){
      const batch=pool.slice(i,i+CFG.BATCH);
      await Promise.all(batch.map(async t=>{
        try{
          const k=await getJSON(API+`/v5/market/kline?category=linear&symbol=${t.symbol}&interval=240&limit=${CFG.KLIMIT}`);
          const r=analyze(t.symbol,k.list,t);
          if(r){ if(r.side) signals.push(r); else if(r.near) nears.push(r); }
        }catch(e){ /* 개별 종목 실패는 건너뜀 */ }
        done++;
      }));
      $("pfill").style.width=Math.round(done/pool.length*100)+"%";
      $("ptext").textContent=`분석 ${done}/${pool.length}`;
    }

    // 렌더
    signals.sort((a,b)=>(b.fresh-a.fresh)||(a.closeT<b.closeT?1:-1));
    const freshN=signals.filter(s=>s.fresh).length;
    $("sum").innerHTML=`전체 <b>${all.length}</b>종목 → 유동성 통과 <b>${pool.length}</b> → 신호 <b>${signals.length}</b> (진입 가능 <b>${freshN}</b>) · ${new Date().toLocaleString("ko-KR",{hour12:false})}`;
    $("sum").className="summary on";

    $("sigList").innerHTML = signals.length
      ? signals.map(s=>ticket(s,seed,lev)).join("")
      : `<div class="card"><div class="empty">현재 조건에 맞는 돌파 신호가 없습니다.<br>신호가 없는 것도 정보입니다 — 규칙에 없는 매매는 하지 않습니다.</div></div>`;
    $("sigSect").className="sect on";

    if(nears.length){
      nears.sort((a,b)=>a.dist-b.dist);
      $("nearList").innerHTML = nears.slice(0,15).map(n=>`
        <div class="nrow"><span class="sym">${n.sym.replace("USDT","")}</span>
        <span class="dir ${n.near}">${n.near==="long"?"롱 임박":"숏 임박"}</span>
        <span class="dist">${n.dist.toFixed(2)} ATR · ${fmt(n.level,n.last)}</span></div>`).join("");
      $("nearSect").className="sect on";
    }
  }catch(e){
    $("err").innerHTML=`데이터를 불러오지 못했습니다.<br>· 인터넷 연결을 확인하세요<br>· 바이비트 API 점검 중이거나 지역 차단일 수 있습니다 (VPN 환경에서 재시도)<br><span style="font-family:var(--mono);font-size:11px;color:var(--dim)">${e.message}</span>`;
    $("err").className="error on";
  }
  $("prog").className="progress";
  btn.disabled=false; btn.textContent="스캔"; running=false;
}
</script>
</body>
</html>
